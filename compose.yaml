services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "8080"
      FLASK_DEBUG: "0"
      DJANGO_BASE_URL: http://frontend:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?Configura AI_INTERNAL_TOKEN en .env}
      OLLAMA_HOST: http://ollama:11434
      HF_HOME: /app/.cache/huggingface
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
      - backend_vectors:/app/chroma_dbs
      - backend_images:/app/images
      - backend_exports:/app/exports
      - backend_pdfs:/app/pdfs
      - hf_cache:/app/.cache/huggingface
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Debes establecer DJANGO_SECRET_KEY en .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,frontend}
      DJANGO_DB_PATH: /app/data/db.sqlite3
      FLASK_BASE_URL: http://backend:8080
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?Configura AI_INTERNAL_TOKEN en .env}
      OLLAMA_BASE_URL: http://ollama:11434
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-0}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@localhost}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 40s
    volumes:
      - django_data:/app/data
      - django_media:/app/media
    depends_on:
      - backend


  ai_worker:
    build:
      context: ./backend
    command: ["python", "ai_worker.py"]
    restart: unless-stopped
    environment:
      DJANGO_BASE_URL: http://frontend:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?Configura AI_INTERNAL_TOKEN en .env}
      OLLAMA_HOST: http://ollama:11434
      HF_HOME: /app/.cache/huggingface
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - backend_uploads:/app/uploads
      - backend_vectors:/app/chroma_dbs
      - hf_cache:/app/.cache/huggingface
    depends_on:
      frontend:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  ollama_data:
  backend_uploads:
  backend_vectors:
  backend_images:
  backend_exports:
  backend_pdfs:
  hf_cache:
  django_data:
  django_media:
