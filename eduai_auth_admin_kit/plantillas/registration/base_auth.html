<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}EduAI{% endblock %} | EduAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 550px;">
        <div class="text-center mb-4">
            <a class="text-decoration-none fs-3 fw-bold" href="{% url 'index' %}">✨ EduAI</a>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">{% block encabezado %}{% endblock %}</h1>
                {% block contenido %}{% endblock %}
            </div>
        </div>
    </main>
</body>
</html>
